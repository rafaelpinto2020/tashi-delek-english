<title>Tashi Delek English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one calm column, phone-first; every screen has one big action at the bottom. */
:root{
  --bg:#FAF9F7; --surface:#F1ECE7; --card:#FFFFFF; --ink:#22191B; --muted:#6A5E60; --line:#E1D9D2;
  --maroon:#8A2232; --on-maroon:#FFFFFF; --saffron:#D9921F; --saffron-soft:#F7E6C6; --sky:#2B67A8;
  --good:#23704A; --good-bg:#E2F1E7; --bad:#B0281F; --bad-bg:#FBE6E3; --hl:#F2C46B;
  --lv1:#F3DDB4; --lv2:#E7B666; --lv3:#C77F2A; --lv4:#8A2232;
  --f-blue:#2F6DB5; --f-white:#F5F5F2; --f-red:#C8323A; --f-green:#2E8B57; --f-yellow:#E9B730;
  --bo:"Noto Sans Tibetan","Noto Serif Tibetan","Jomolhari","Kailasa","Microsoft Himalaya","Qomolangma-UchenSarchung","Monlam Uni OuChan2",serif;
  --en:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181213; --surface:#231B1D; --card:#2B2224; --ink:#F4EDEB; --muted:#B5A8A9; --line:#3E3335;
  --maroon:#B03A4F; --on-maroon:#FFFFFF; --saffron:#F0B451; --saffron-soft:#3D2F18; --sky:#79AEE8;
  --good:#71CF98; --good-bg:#1B3124; --bad:#F2897F; --bad-bg:#3B1F1C; --hl:#8A6420;
  --lv1:#4A3A22; --lv2:#7A5A26; --lv3:#B07A2E; --lv4:#D0566B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181213; --surface:#231B1D; --card:#2B2224; --ink:#F4EDEB; --muted:#B5A8A9; --line:#3E3335;
  --maroon:#B03A4F; --on-maroon:#FFFFFF; --saffron:#F0B451; --saffron-soft:#3D2F18; --sky:#79AEE8;
  --good:#71CF98; --good-bg:#1B3124; --bad:#F2897F; --bad-bg:#3B1F1C; --hl:#8A6420;
  --lv1:#4A3A22; --lv2:#7A5A26; --lv3:#B07A2E; --lv4:#D0566B; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--en);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.bo{font-family:var(--bo);line-height:1.75;font-size:1.15em}
.en-sub{color:var(--muted);font-size:.82rem;font-family:var(--en)}
p{margin:0}

/* Tibetan read-along */
.sy{border-radius:4px;transition:background-color .12s}
.sy.on{background:var(--hl);color:var(--ink)}
.vbtn{display:inline-grid;place-items:center;vertical-align:middle;width:40px;height:40px;margin-left:8px;border-radius:50%;border:2px solid var(--saffron);background:var(--card);padding:0}
.vbtn svg{width:20px;height:20px;fill:var(--saffron)}

.flags{display:flex;height:8px;border-radius:0 0 6px 6px;overflow:hidden;margin-bottom:18px}
.flags i{flex:1}
.flags i:nth-child(1){background:var(--f-blue)} .flags i:nth-child(2){background:var(--f-white);box-shadow:inset 0 -1px 0 var(--line)}
.flags i:nth-child(3){background:var(--f-red)} .flags i:nth-child(4){background:var(--f-green)} .flags i:nth-child(5){background:var(--f-yellow)}

/* home */
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello-bo{font-size:1.45rem;font-weight:600}
.who{background:var(--surface);border:1px solid var(--line);border-radius:999px;min-width:56px;height:56px;font-size:28px;flex:none}
.today{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:22px 0}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface);fill:none;stroke-width:12}
.ring .val{stroke:var(--saffron);fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ring .of{font-size:.8rem;color:var(--muted)}
.stats{display:grid;gap:12px;min-width:0}
.stat{display:flex;align-items:baseline;gap:10px}
.stat b{font-size:1.7rem;font-variant-numeric:tabular-nums;min-width:2ch}
.stat .lbl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.stat .lbl .bo{font-size:1rem}
.cta{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;border:0;border-radius:var(--r);background:var(--maroon);color:var(--on-maroon);padding:18px 16px;min-height:76px}
.cta .bo{font-size:1.35rem;font-weight:600}
.cta .en-sub{color:inherit;opacity:.85}
.plan{margin:12px 2px 0;color:var(--muted);font-size:.9rem;text-align:center}
.plan .bo{font-size:1rem}
.unitnow{margin-top:22px;padding:14px 16px;border-radius:var(--r);background:var(--surface);display:flex;gap:14px;align-items:center}
.unitnow .pic{font-size:34px}
.unitnow .bar{background:var(--card);margin-top:6px}
.stagerow{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);margin-top:10px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 28px}
.menu button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:4px}
.menu svg{width:28px;height:28px;stroke:var(--maroon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu .bo{font-size:1rem;line-height:1.4}
.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--saffron-soft);font-size:.9rem}
.bar{height:10px;background:var(--surface);border-radius:999px;overflow:hidden;flex:1}
.bar span{display:block;height:100%;background:var(--saffron);border-radius:999px;transition:width .4s}

/* lesson */
.lesson{display:flex;flex-direction:column;min-height:100%;flex:1}
.ltop,.subtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
.icon-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;min-width:4.5ch;text-align:right}
.lbody{flex:1;padding:8px 0 20px;display:flex;flex-direction:column;gap:14px}
.lfoot{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.prompt{font-size:1.3rem;font-weight:600;text-align:center}
.prompt .bo{font-size:1.3rem}
.prompt + .en-sub{text-align:center;margin-top:-10px}
.btn{border:0;border-radius:var(--r);min-height:64px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.btn .bo{font-size:1.2rem}
.btn.primary{background:var(--maroon);color:var(--on-maroon)}
.btn.primary .en-sub{color:inherit;opacity:.85}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}
.audio-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.play{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--sky);color:#fff;padding:0 22px;height:60px;font-weight:600}
.play svg{width:26px;height:26px;fill:#fff}
.play.big{height:76px;padding:0 30px}
.play.big svg{width:34px;height:34px}
.play.bo-play{background:var(--saffron);color:#22191B}
.play.bo-play svg{fill:#22191B}
.slow{border:2px solid var(--sky);background:transparent;color:var(--sky);border-radius:999px;height:60px;padding:0 18px;font-weight:600;display:flex;align-items:center;gap:6px}
.play.big + .slow{height:76px}
.slow span:first-child{font-size:24px}
.teach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.pic{font-size:56px;line-height:1.1}
.pic.big{font-size:100px;margin-top:6px}
.pic.num{font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--en);font-size:44px}
.pic.num.big{font-size:84px}
.pic.num small{font-family:var(--bo);font-weight:400;margin-left:.15em;color:var(--maroon);font-size:.6em}
.word{font-size:2.6rem;font-weight:700;letter-spacing:.01em;line-height:1.1;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:1rem}
.hint::before{content:"སྒྲ  ";color:var(--saffron)}
.meaning{font-size:1.4rem;font-weight:600;color:var(--maroon)}
.say{margin-top:6px;background:var(--surface);border-radius:var(--r);padding:12px 16px;text-align:center;width:100%}
.say .bo{font-size:1.05rem}
.dots{display:flex;gap:16px;justify-content:center;margin-top:10px}
.dot{width:52px;height:52px;border-radius:50%;border:3px solid var(--saffron);background:transparent}
.dot.on{background:var(--saffron)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:var(--r);min-height:140px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;cursor:pointer}
.tile .tmean{font-size:1rem}
.tile .vbtn{position:absolute;top:6px;right:6px;margin:0;width:38px;height:38px}
.tile.ok,.sopt.ok,.lbtn.ok,.dline-opt.ok{border-color:var(--good);background:var(--good-bg)}
.tile.no,.sopt.no,.lbtn.no,.dline-opt.no{border-color:var(--bad);background:var(--bad-bg)}
.tile.locked{cursor:default}
.readword{font-size:2.6rem;font-weight:700;text-align:center;padding:10px 0;overflow-wrap:anywhere}
.ask{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.sopts{display:grid;gap:10px}
.sopt{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);min-height:72px;padding:8px 16px;text-align:left}
.sopt.sel{border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 25%,transparent)}
.sopt .spk{width:44px;height:44px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex:none}
.sopt .spk svg{width:22px;height:22px;fill:#fff}
.sopt .sw{font-size:1.35rem;font-weight:600}
.fb{border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.fb.good{background:var(--good-bg)} .fb.bad{background:var(--bad-bg)}
.fb-h{display:flex;align-items:baseline;gap:10px;font-weight:700;flex-wrap:wrap}
.fb.good .fb-h .bo{color:var(--good)} .fb.bad .fb-h .bo{color:var(--bad)}
.fb-ans{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb-ans .pic{font-size:36px}
.fb-ans .pic.num{font-size:28px}
.fb-ans b{font-size:1.45rem}
.sentence{font-size:1.9rem;font-weight:700;text-align:center;line-height:1.25}
.slots{min-height:84px;border:2px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.slot-ph{color:var(--muted);font-size:1.6rem;padding:0 6px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px}
.wchip{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:56px;padding:6px 16px;font-size:1.3rem;font-weight:600}
.slots .wchip{border-color:var(--sky)}
.letter{font-size:7rem;font-weight:700;line-height:1;text-align:center;color:var(--maroon)}
.letter span{font-size:.6em;margin-left:.2em;color:var(--ink)}
.lex{display:flex;align-items:center;justify-content:center;gap:12px}
.lex .word{font-size:2.2rem}
.lex mark{background:var(--saffron-soft);color:var(--maroon);border-radius:6px;padding:0 2px}
.lbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lbtn{background:var(--card);border:2px solid var(--line);border-radius:var(--r);min-height:110px;font-size:3.2rem;font-weight:700}
.section,.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:28px 0}
.section .ic,.done .ic{font-size:72px}
.section h2,.done h2{margin:0;font-weight:600;font-size:1.8rem;line-height:1.6}
.section h2 .bo,.done h2 .bo{font-size:1.8rem}
.section .count{margin-top:8px;font-weight:700;color:var(--maroon);font-size:1.4rem}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:10px}
.sumgrid div{background:var(--surface);border-radius:14px;padding:12px 6px}
.sumgrid b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums}
.sumgrid .bo{font-size:.95rem}

/* pattern + dialogue */
.pattern{background:var(--surface);border-radius:var(--r);padding:18px 16px;display:grid;gap:10px;text-align:center}
.pattern .pen{font-size:2.2rem;font-weight:700;color:var(--maroon)}
.pattern .pbo{font-size:1.5rem}
.pattern .note{text-align:left;font-size:1rem}
.exrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:14px;padding:10px 12px}
.exrow .play{height:48px;padding:0 14px}
.exrow .play svg{width:22px;height:22px}
.exrow b{font-size:1.15rem;display:block}
.exrow .bo{font-size:1rem}
.dlines{display:grid;gap:10px}
.dline{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.dline.b{background:var(--surface)}
.dline .who2{font-size:30px;text-align:center}
.dline b{display:block;font-size:1.1rem}
.dline .bo{font-size:1rem}
.dline .play{height:48px;width:48px;padding:0;justify-content:center}
.dline .play svg{width:22px;height:22px}
.dline.now{outline:3px solid var(--saffron)}
.dline-opts{display:grid;gap:10px}
.dline-opt{position:relative;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 54px 12px 14px;min-height:64px;text-align:left;cursor:pointer}
.dline-opt .vbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);margin:0}

/* sub screens */
.subtop h1{margin:0;font-size:1.3rem;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.subtop h1 .bo{font-size:1.25rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h3 .bo{font-size:1.1rem}
.bignums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.bignums div{background:var(--surface);border-radius:14px;padding:14px}
.bignums b{display:block;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.bignums .bo{font-size:1rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-family:var(--bo);font-size:.8rem;color:var(--muted)}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.lv1{background:var(--lv1);color:var(--ink)} .cal .d.lv2{background:var(--lv2);color:var(--ink)}
.cal .d.lv3{background:var(--lv3);color:#fff} .cal .d.lv4{background:var(--lv4);color:#fff}
.cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
.cal .d.fut{background:transparent}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block;background:var(--surface)}
.urow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.urow:first-of-type{border-top:0}
.urow .pic{font-size:26px}
.urow .bo{font-size:1rem}
.urow small{font-variant-numeric:tabular-nums;color:var(--muted)}
.stagehead{margin:18px 2px 8px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stagehead .bo{font-size:1.1rem}
details.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.unit summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px}
details.unit summary::-webkit-details-marker{display:none}
details.unit summary .pic{font-size:30px}
details.unit summary .t{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
details.unit summary .t .bo{font-size:1.05rem}
.wrow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;width:100%;border-top:1px solid var(--line);padding:10px 16px;min-height:64px}
.wrow .pic{font-size:30px}
.wrow .pic.num{font-size:20px}
.wrow .en{font-weight:700;font-size:1.1rem;background:none;border:0;padding:0;text-align:left;color:var(--sky)}
.wrow .bo{font-size:1rem;color:var(--muted)}
.wrow.locked{opacity:.55}
.uextra{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.lvl{font-size:.75rem;border-radius:999px;padding:3px 9px;white-space:nowrap}
.lvl.k{background:var(--good-bg);color:var(--good)} .lvl.l{background:var(--saffron-soft);color:var(--ink)} .lvl.n{background:var(--surface);color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:60px;font-weight:600}
.seg button.on{border-color:var(--maroon);background:var(--maroon);color:var(--on-maroon)}
select{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:140px}
.howto{font-size:.95rem}
.howto li{margin-bottom:8px}
.howto ul{padding-left:20px;margin:6px 0 0}

/* studio */
.studio-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:grid;gap:10px;text-align:center}
.studio-card .ctx{font-size:.85rem;color:var(--muted)}
.studio-card .rtext{font-size:1.8rem;line-height:1.8}
.recbtn{width:112px;height:112px;border-radius:50%;border:6px solid var(--bad-bg);background:var(--bad);color:#fff;margin:4px auto;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.recbtn.on{animation:pulse 1.1s infinite;background:var(--bad);border-color:var(--hl)}
.recbtn i{display:block;width:34px;height:34px;border-radius:50%;background:#fff}
.recbtn.on i{border-radius:6px;width:30px;height:30px}
@keyframes pulse{50%{transform:scale(1.06)}}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem}
.chip.ok{background:var(--good-bg);color:var(--good)} .chip.no{background:var(--surface);color:var(--muted)}

.profiles{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:30px 0}
.profiles h1{margin:0;text-align:center;font-weight:600;font-size:1.8rem;line-height:1.6}
.profiles h1 .bo{font-size:1.8rem}
.profiles > .en-sub{text-align:center;margin-top:-12px}
.pbtn{display:flex;align-items:center;gap:18px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 20px;min-height:100px;text-align:left}
.pbtn .pic{font-size:54px}

/* ---------- Tibetan voice: recordings matched by exact Tibetan text ---------- */
const VOICE=new Map(),BLOBS=new Map();let idb=null;
function setClip(t,blob){const o=VOICE.get(t);if(o)URL.revokeObjectURL(o);VOICE.set(t,URL.createObjectURL(blob));BLOBS.set(t,blob)}
function dataURLtoBlob(u){const[h,b]=u.split(",");const mt=(h.match(/data:([^;]+)/)||[])[1]||"audio/webm";const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mt})}
const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(b)});
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open("tde-voice",1);r.onupgradeneeded=()=>r.result.createObjectStore("clips");r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function idbAll(){return new Promise(res=>{if(!idb)return res([]);try{const out=[];const rq=idb.transaction("clips").objectStore("clips").openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};rq.onerror=()=>res(out)}catch(e){res([])}})}
function idbPut(k,v){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction("clips","readwrite");tx.objectStore("clips").put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
async function initVoice(){
 try{const el=document.getElementById("voicepack");const pack=JSON.parse(el&&el.textContent||"{}");for(const[k,v] of Object.entries(pack.clips||{}))setClip(k,dataURLtoBlob(v))}catch(e){}
 await idbOpen();for(const[k,b] of await idbAll())if(b instanceof Blob)setClip(k,b);
 render();
}
const hasV=t=>VOICE.has(t);

/* Tibetan text, split into syllables for read-along, with a speaker button when recorded */
const KEYS=[],KIDX=new Map();function kid(t){if(!KIDX.has(t)){KIDX.set(t,KEYS.length);KEYS.push(t)}return KIDX.get(t)}
function sylls(t){const out=[];let c="";for(const ch of t){c+=ch;if(ch==="་"||ch==="།"||ch===" "){out.push(c);c=""}}if(c)out.push(c);return out}
function bo(t,cls="",btn=true){const i=kid(t);return `<span class="bo ${cls}" data-k="${i}">${sylls(t).map(s=>`<span class="sy">${esc(s)}</span>`).join("")}${btn&&hasV(t)?`<button class="vbtn" data-a="pbo" data-k="${i}" aria-label="Hear it in Tibetan">${IC.spk}</button>`:""}</span>`}
const boTxt=(t,cls="")=>`<span class="bo ${cls}">${esc(t)}</span>`;

/* ---------- audio ---------- */
const HAS_TTS="speechSynthesis" in window;let voices=[],curAudio=null,seqTok=0,hlRaf=0;
function loadVoices(){if(!HAS_TTS)return;try{voices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang))}catch(e){voices=[]}}
if(HAS_TTS){loadVoices();try{speechSynthesis.onvoiceschanged=()=>{loadVoices();if(screen==="settings")render()}}catch(e){}}
function pickVoice(){const s=S&&S.settings.voice;return voices.find(v=>v.voiceURI===s)||voices.find(v=>/en[-_]US/i.test(v.lang)&&v.localService)||voices.find(v=>/en[-_](US|GB)/i.test(v.lang))||voices[0]}
function speakP(text,slow){return new Promise(res=>{if(!HAS_TTS)return res();try{const t=sayable(text);const u=new SpeechSynthesisUtterance(t);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";u.rate=slow?0.55:(S?S.settings.rate:0.8);let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,1500+t.length*(slow?160:110));speechSynthesis.speak(u)}catch(e){res()}})}
function clearHL(){cancelAnimationFrame(hlRaf);document.querySelectorAll(".sy.on").forEach(e=>e.classList.remove("on"))}
function stopAll(){seqTok++;try{if(HAS_TTS)speechSynthesis.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}clearHL()}
function playBoRaw(t){return new Promise(res=>{const u=VOICE.get(t);if(!u)return res();const a=new Audio(u);curAudio=a;const n=sylls(t).length,i=kid(t),t0=performance.now();
 const tick=()=>{const groups=[...document.querySelectorAll(`.bo[data-k="${i}"]`)].map(e=>[...e.querySelectorAll(".sy")]);const d=isFinite(a.duration)&&a.duration>0?a.duration:Math.max(0.8,n*0.32);const cur=a.currentTime||((performance.now()-t0)/1000);const idx=Math.floor(Math.min(.999,cur/d)*n);groups.forEach(g=>g.forEach((s,j)=>s.classList.toggle("on",j<=idx)));if(!a.paused&&!a.ended)hlRaf=requestAnimationFrame(tick)};
 const fin=()=>{setTimeout(clearHL,250);res()};a.onplaying=()=>{hlRaf=requestAnimationFrame(tick)};a.onended=fin;a.onerror=fin;const p=a.play();if(p&&p.catch)p.catch(fin)})}
async function playSeq(list){stopAll();const my=seqTok;for(const s of list){if(!s)continue;if(my!==seqTok)return;if(s.en)await speakP(s.en,s.slow);else if(s.bo)await playBoRaw(s.bo);else if(s.gap)await sleep(s.gap)}}
const boStep=t=>hasV(t)?{bo:t}:null;
function promptOnce(key){if(!S.settings.boAuto||!L||L.heard[key])return null;L.heard[key]=1;return boStep(UI[key])}

/* ---------- active-time timer ---------- */
let lastAct=Date.now();
["pointerdown","keydown","touchstart"].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now()},true));
setInterval(()=>{if(!S||screen!=="lesson"||document.hidden)return;if(Date.now()-lastAct>120000)return;const d=today();d.sec++;if(d.sec%5===0)save();const t=document.getElementById("timer");if(t)t.textContent=fmtTimer()},1000);
function fmtTimer(){const s=today().sec;return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

/* ---------- learning logic ---------- */
function dueCards(){const t=dkey();return Object.keys(S.cards).filter(id=>BYID[id]&&S.cards[id].due<=t).sort((a,b)=>S.cards[a].due<S.cards[b].due?-1:1)}
const countKnown=()=>Object.keys(S.cards).filter(id=>BYID[id]&&S.cards[id].box>=3).length;
const countSeen=()=>Object.keys(S.cards).filter(id=>BYID[id]).length;
const curUnitIdx=()=>ITEMS[Math.min(S.newIdx,ITEMS.length-1)].unit;
const lastUnitIdx=()=>S.newIdx?ITEMS[S.newIdx-1].unit:0;
function dayOk(k){const d=S.days[k];return !!(d&&(d.done||d.sec>=300))}
function calcStreak(){let k=dkey();if(!dayOk(k))k=addDays(k,-1);let n=0;while(dayOk(k)){n++;k=addDays(k,-1)}return n}
function newToday(){const cap=dueCards().length>60?3:NEW_PER_DAY;return Math.max(0,Math.min(cap-today().nw,ITEMS.length-S.newIdx))}
function modeFor(id,practice){const b=S.cards[id].box;const o=b>=3?["read","sound","listen"]:["listen","sound"];return o[Math.floor(Math.random()*(practice?o.length:Math.min(2,o.length)))]}
const unitDone=ui=>UNITS[ui].items.every((a,k)=>S.cards[UNITS[ui].id+":"+a[1]]);

function buildDaily(){
 const steps=[],d=today();
 const due=dueCards().slice(0,45);
 if(due.length){steps.push({t:"section",k:"review",n:due.length});shuffle(due).forEach(id=>steps.push({t:"quiz",id,mode:modeFor(id),review:true}))}
 const n=newToday();const newIds=ITEMS.slice(S.newIdx,S.newIdx+n).map(i=>i.id);
 if(newIds.length){
  const firsts=[...new Set(newIds.map(id=>BYID[id]).filter(it=>it.k===0&&UNITS[it.unit].pattern).map(it=>it.unit))];
  firsts.forEach(ui=>{steps.push({t:"section",k:"pattern"});steps.push({t:"pattern",ui})});
  steps.push({t:"section",k:"new",n:newIds.length});
  newIds.forEach(id=>steps.push({t:"teach",id}));
  shuffle(newIds).forEach(id=>steps.push({t:"quiz",id,mode:"listen",fresh:true}));
  shuffle(newIds).forEach(id=>steps.push({t:"quiz",id,mode:"sound",fresh:true}));
 }
 const lastU=ITEMS[Math.min(S.newIdx+n,ITEMS.length)-1].unit;
 const perDay=UNITS[lastU].stage>=2?2:1;const want=Math.max(0,perDay-d.ph);
 const ph=[];let idx=S.phraseIdx;
 for(let j=0;j<want;j++){if(PHRASES[idx]&&PHRASES[idx].unit<=lastU){ph.push({p:PHRASES[idx],isNew:true});idx++}else if(S.phraseIdx>0){ph.push({p:PHRASES[Math.floor(Math.random()*S.phraseIdx)],isNew:false})}}
 if(ph.length){steps.push({t:"section",k:"phrase"});ph.forEach(x=>steps.push({t:"phrase",p:x.p,isNew:x.isNew}))}
 if(!d.dl){const ui=UNITS.findIndex((u,i)=>u.dialogue&&!S.dlg.includes(i)&&unitDone(i));if(ui>=0){steps.push({t:"section",k:"dialogue"});steps.push({t:"dialogue",ui})}}
 if(S.letters<26&&d.lt<2){const ls=[S.letters,S.letters+1].slice(0,2-d.lt).filter(i=>i<26);if(ls.length){steps.push({t:"section",k:"abc"});ls.forEach(i=>steps.push({t:"letter",i}));ls.forEach(i=>steps.push({t:"lquiz",i}))}}
 else if(S.letters>=26&&!d.rd){const pool=Object.keys(S.cards).filter(id=>BYID[id]&&S.cards[id].box>=2);if(pool.length>=4){steps.push({t:"section",k:"reading"});shuffle(pool).slice(0,4).forEach(id=>steps.push({t:"quiz",id,mode:"read",practice:true,reading:true}))}}
 steps.push({t:"done"});
 return steps;
}
function buildPractice(){
 const seen=Object.keys(S.cards).filter(id=>BYID[id]);if(!seen.length)return null;
 const sorted=shuffle(seen).sort((a,b)=>S.cards[a].box-S.cards[b].box);
 const pick=shuffle(sorted.slice(0,Math.min(30,sorted.length))).slice(0,15);
 const steps=[{t:"section",k:"practice",n:pick.length}];
 pick.forEach(id=>steps.push({t:"quiz",id,mode:modeFor(id,true),practice:true}));
 if(S.phraseIdx>0)steps.push({t:"phrase",p:PHRASES[Math.floor(Math.random()*S.phraseIdx)],isNew:false});
 if(S.letters>=3)steps.push({t:"lquiz",i:Math.floor(Math.random()*S.letters)});
 steps.push({t:"done"});
 return steps;
}
function distractors(id,n){const it=BYID[id];const pool=ITEMS.filter(x=>x.id!==id&&x.pic!==it.pic&&x.bo!==it.bo);let c=shuffle(pool.filter(x=>x.unit===it.unit));if(c.length<n)c=c.concat(shuffle(pool.filter(x=>x.unit!==it.unit&&Math.abs(x.unit-it.unit)<6)));if(c.length<n)c=c.concat(shuffle(pool));return c.slice(0,n)}
function grade(st,ok){
 const c=S.cards[st.id];if(!c)return;
 ok?(c.r=(c.r||0)+1):(c.w=(c.w||0)+1);ok?L.stats.r++:L.stats.w++;
 if(st.review&&!st.requeue){if(ok){c.box=Math.min(c.box+1,INTERVALS.length-1);c.due=addDays(dkey(),INTERVALS[c.box])}else{c.box=1;c.due=addDays(dkey(),1)}}
 if(st.practice&&!ok){c.box=1;c.due=addDays(dkey(),1)}
 if(!ok&&!st.requeue){L.steps.splice(Math.min(L.i+4,L.steps.length-1),0,{t:"quiz",id:st.id,mode:"listen",requeue:true})}
 save();
}

 const cta=done
  ?`<button class="cta" data-a="startPractice">${boTxt(UI.more)}<span class="en-sub">Today's lesson is done. Practise more</span></button>`

   <div class="mid"><span class="num">${min}</span><span class="of">/ 30 ${esc(UI.minutes)}</span></div></div>
  <div class="stats">
   <div class="stat"><b>${calcStreak()}</b><span class="lbl">${bo(UI.streak)}<span class="en-sub">days in a row</span></span></div>
   <div class="stat"><b>${countKnown()}</b><span class="lbl">${bo(UI.known)}<span class="en-sub">words known</span></span></div>
  </div>
 </section>
 ${cta}${plan}${notice}

/* ---------- lesson ---------- */
const cur=()=>L.steps[L.i];
const btnListen=(t,big)=>`<button class="play ${big?"big":""}" data-a="play" data-t="${esc(t)}" aria-label="Listen">${IC.spk}<span class="bo" style="font-size:1rem">ཉོན།</span></button>`;
const btnSlow=t=>`<button class="slow" data-a="play" data-t="${esc(t)}" data-slow="1" aria-label="Slow"><span aria-hidden="true">🐢</span><span class="bo" style="font-size:1rem">དལ་མོ།</span></button>`;
const btnBo=t=>hasV(t)?`<button class="play bo-play" data-a="pbo" data-k="${kid(t)}" aria-label="Hear it in Tibetan">${IC.spk}<span class="bo" style="font-size:1rem">བོད་སྐད།</span></button>`:"";
function sayDots(){return `<div class="say">${bo(UI.sayThree)}<p class="en-sub">Say it out loud 3 times. Tap a circle each time.</p><div class="dots">${[0,1,2].map(i=>`<button class="dot ${L.say>i?"on":""}" data-a="say" aria-label="Said it ${i+1}"></button>`).join("")}</div></div>`}
const contBtn=()=>`<button class="btn primary" data-a="next">${boTxt(UI.cont)}<span class="en-sub">Continue</span></button>`;
const prompt=(key,en)=>`<p class="prompt">${bo(UI[key])}</p><p class="en-sub">${en}</p>`;
function viewLesson(){
 const st=cur(),total=L.steps.length,pct=Math.round(L.i/Math.max(1,total-1)*100);
 return `<div class="lesson"><div class="ltop"><button class="icon-btn" data-a="quit" aria-label="Close lesson">${IC.x}</button><div class="bar"><span style="width:${pct}%"></span></div><span class="timer" id="timer">${fmtTimer()}</span></div>
 <div class="lbody">${stepBody(st)}</div><div class="lfoot">${stepFoot(st)}</div></div>`;
}
function stepBody(st){
 switch(st.t){
 case "section":{const s=SECT[st.k];return `<div class="section"><div class="ic">${s.ic}</div><h2>${bo(UI["s_"+st.k])}</h2><p class="en-sub">${s.en}</p><p style="margin-top:10px">${bo(UI["d_"+st.k])}</p><p class="en-sub">${s.den}</p>${st.n?`<p class="count">${st.n}</p>`:""}</div>`}
 case "teach":{const it=BYID[st.id];return `<div class="teach">${picHTML(it.pic,"big")}<div class="word">${esc(it.en)}</div>${S.settings.hints&&it.hint?`<div class="hint">${boTxt(it.hint)}</div>`:""}<div class="meaning">${bo(it.bo)}</div><div class="audio-row">${btnListen(it.en)}${btnSlow(it.en)}</div>${sayDots()}</div>`}
 case "quiz":return quizBody(st);
 case "phrase":return phraseBody(st);
 case "pattern":return patternBody(st);
 case "dialogue":return dialogueBody(st);
 case "letter":{const[c,,w,p]=LETTERS[st.i];const hw=esc(w).replace(new RegExp(c,"i"),m=>`<mark>${m}</mark>`);return `${prompt("newLetter","New letter")}<div class="letter">${c}<span>${c.toLowerCase()}</span></div><div class="lex">${picHTML(p)}<span class="word">${hw}</span></div><div class="audio-row">${btnListen(letterSay(st.i))}${btnSlow(letterSay(st.i))}</div>${sayDots()}`}
 case "lquiz":return lquizBody(st);
 case "done":return doneBody();
 }return "";
}
function fbBox(ok,inner){return `<div class="fb ${ok?"good":"bad"}"><div class="fb-h">${ok?`${bo(UI.correct)}<span class="en-sub">Correct</span>`:`${bo(UI.answerIs)}<span class="en-sub">The answer is</span>`}</div>${inner}${contBtn()}</div>`}
function stepFoot(st){
 if(st.t==="section")return `<button class="btn primary" data-a="next">${boTxt(UI.begin)}<span class="en-sub">Begin</span></button>`;
 if(st.t==="teach"||st.t==="letter"||st.t==="pattern")return contBtn();
 if(st.t==="quiz"||st.t==="lquiz"){
  if(L.ans){if(st.t==="quiz"){const it=BYID[st.id];return fbBox(L.ans.ok,`<div class="fb-ans">${picHTML(it.pic)}<b>${esc(it.en)}</b>${bo(it.bo)}</div>`)}return fbBox(L.ans.ok,`<div class="fb-ans"><b style="font-size:2.4rem">${LETTERS[st.i][0]} ${LETTERS[st.i][0].toLowerCase()}</b></div>`)}
  if(st.t==="quiz"&&st.mode==="sound")return `<button class="btn primary" data-a="check" ${L.sel?"":"disabled"}>${boTxt(UI.check)}<span class="en-sub">Check</span></button>`;
  return "";
 }
 if(st.t==="phrase"){
  if(st.phase==="listen")return `<button class="btn primary" data-a="phraseBuild">${boTxt(UI.cont)}<span class="en-sub">Next: build the sentence</span></button>`;
  if(st.phase==="build")return `<button class="btn primary" data-a="phraseCheck" ${st.pool&&st.pool.length?"disabled":""}>${boTxt(UI.check)}<span class="en-sub">Check</span></button>`;
  return fbBox(st.ok,`<div class="fb-ans"><b>${esc(st.p.en)}</b></div>`);
 }
 if(st.t==="dialogue"){
  if(st.phase==="listen")return `<button class="btn primary" data-a="dlgQuiz">${boTxt(UI.cont)}<span class="en-sub">Next: a question about it</span></button>`;
  if(st.ans)return fbBox(st.ans.ok,`<div class="fb-ans"><b>${esc(st.q[1])}</b>${bo(st.q[2])}</div>`);
  return "";
 }
 if(st.t==="done")return `${countSeen()?`<button class="btn primary" data-a="startPractice">${boTxt(UI.more)}<span class="en-sub">Practise more</span></button>`:""}<button class="btn ghost" data-a="nav" data-s="home">${boTxt(UI.home)}<span class="en-sub">Home</span></button>`;
 return "";
}
function tile(o,st){let c="tile";const a=L.ans;if(a){c+=" locked";if(o.id===st.id)c+=" ok";else if(o.id===a.pick)c+=" no"}return `<div class="${c}" role="button" tabindex="0" ${a?"":`data-a="pick" data-id="${o.id}"`}>${picHTML(o.pic)}${bo(o.bo,"tmean")}</div>`}
function quizBody(st){
 const it=BYID[st.id];
 if(!st.opts)st.opts=shuffle([it,...distractors(st.id,st.mode==="sound"?2:3)]);
 if(st.mode==="listen")return `${prompt("listenWhich","Listen. Which one is it?")}<div class="audio-row">${btnListen(it.en,true)}${btnSlow(it.en)}</div><div class="tiles">${st.opts.map(o=>tile(o,st)).join("")}</div>`;
 if(st.mode==="read")return `${prompt("readWhich","Read. Which one is it?")}<div class="readword">${esc(it.en)}</div><div class="tiles">${st.opts.map(o=>tile(o,st)).join("")}</div>`;
 return `${prompt("howSay","How do you say this in English? Tap to hear each one.")}<div class="ask">${picHTML(it.pic,"big")}<div class="meaning">${bo(it.bo)}</div></div>
 <div class="sopts">${st.opts.map(o=>{let c="sopt";if(L.ans){if(o.id===st.id)c+=" ok";else if(o.id===L.ans.pick)c+=" no"}else if(L.sel===o.id)c+=" sel";return `<button class="${c}" data-a="sel" data-id="${o.id}" ${L.ans?"disabled":""}><span class="spk">${IC.spk}</span><span class="sw">${esc(o.en)}</span></button>`}).join("")}</div>`;
}
function phraseBody(st){
 const p=st.p;if(!st.phase)st.phase="listen";
 if(st.phase==="listen")return `${prompt("repeat","Listen and repeat")}<div class="sentence">${esc(p.en)}</div><div class="meaning" style="text-align:center">${bo(p.bo)}</div><div class="audio-row">${btnListen(p.en,true)}${btnSlow(p.en)}</div>${sayDots()}`;
 if(!st.words){st.words=p.en.split(" ");let o;let tries=0;do{o=shuffle(st.words.map((w,i)=>i));tries++}while(st.words.length>1&&tries<20&&o.every((v,i)=>st.words[v]===st.words[i]));st.pool=o;st.ans=[]}
 const lock=st.phase==="result";
 return `${prompt("order","Tap the words in the right order")}<div class="meaning" style="text-align:center">${bo(p.bo)}</div><div class="audio-row">${btnListen(p.en)}${btnSlow(p.en)}</div>
 <div class="slots">${st.ans.length?st.ans.map((wi,k)=>`<button class="wchip" data-a="unchip" data-k="${k}" ${lock?"disabled":""}>${esc(st.words[wi])}</button>`).join(""):'<span class="slot-ph">…</span>'}</div>
 <div class="pool">${st.pool.map((wi,k)=>`<button class="wchip" data-a="chip" data-k="${k}">${esc(st.words[wi])}</button>`).join("")}</div>`;
}
function exRow(en,b){return `<div class="exrow"><button class="play" data-a="play" data-t="${esc(en)}" aria-label="Listen">${IC.spk}</button><div style="min-width:0"><b>${esc(en)}</b>${bo(b)}</div></div>`}
function patternBody(st){const u=UNITS[st.ui],pt=u.pattern;
 return `<div class="pattern"><div class="pen">${esc(pt.en)}</div><div class="pbo">${bo(pt.bo)}</div><div class="audio-row">${btnListen(pt.en)}${btnBo(pt.note)}</div><p class="note">${bo(pt.note)}</p>${pt.ex.map(e=>exRow(e[0],e[1])).join("")}</div>`}
function dialogueBody(st){
 const u=UNITS[st.ui],dl=u.dialogue;if(!st.phase)st.phase="listen";
 if(st.phase==="listen")return `${prompt("dlgListen","Listen to the conversation. Tap any line to hear it again.")}<div class="audio-row"><button class="play big" data-a="dlgAll">${IC.spk}<span class="bo" style="font-size:1rem">ཚང་མ་ཉོན།</span></button></div>
 <div class="dlines">${dl.map((l,i)=>`<div class="dline ${l[0]==="B"?"b":""}" id="dl${i}"><span class="who2">${l[0]==="A"?"🧑":"👵"}</span><div style="min-width:0"><b>${esc(l[1])}</b>${bo(l[2])}</div><button class="play" data-a="play" data-t="${esc(l[1])}" aria-label="Listen">${IC.spk}</button></div>`).join("")}</div>`;
 if(!st.q){const qi=Math.floor(Math.random()*dl.length);st.q=dl[qi];st.opts=shuffle([qi,...shuffle(dl.map((l,i)=>i).filter(i=>i!==qi&&dl[i][2]!==dl[qi][2])).slice(0,2)])}
 return `${prompt("dlgQ","What does this line mean?")}<div class="sentence">${esc(st.q[1])}</div><div class="audio-row">${btnListen(st.q[1],true)}${btnSlow(st.q[1])}</div>
 <div class="dline-opts">${st.opts.map(i=>{let c="dline-opt";if(st.ans){if(dl[i]===st.q)c+=" ok";else if(i===st.ans.pick)c+=" no"}return `<div class="${c}" role="button" tabindex="0" ${st.ans?"":`data-a="dlgPick" data-i="${i}"`}>${bo(dl[i][2])}</div>`}).join("")}</div>`;
}
function lquizBody(st){
 if(!st.opts){const max=Math.max(S.letters,st.i+1);let pool=shuffle([...Array(max).keys()].filter(i=>i!==st.i)).slice(0,2);if(pool.length<2)pool=pool.concat(shuffle([...Array(26).keys()].filter(i=>i!==st.i&&!pool.includes(i))).slice(0,2-pool.length));st.opts=shuffle([st.i,...pool])}
 return `${prompt("whichLetter","Listen. Which letter is it?")}<div class="audio-row">${btnListen(LETTERS[st.i][1],true)}</div><div class="lbtns">${st.opts.map(i=>{let c="lbtn";if(L.ans){if(i===st.i)c+=" ok";else if(i===L.ans.pick)c+=" no"}return `<button class="${c}" data-a="lpick" data-i="${i}" ${L.ans?"disabled":""}>${LETTERS[i][0]}</button>`}).join("")}</div>`;
}
function doneBody(){
 const s=L.stats,tot=s.r+s.w,pct=tot?Math.round(s.r/tot*100):100,min=Math.floor(today().sec/60);
 return `<div class="done"><div class="ic">🎉</div><h2>${bo(UI.correct)}</h2><p class="en-sub">Well done!</p>

const letterSay=i=>{const[,n,w]=LETTERS[i];return `${n}. ${n} is for ${w}.`};
function afterLesson(){

 if(st.t==="section"){playSeq([S.settings.boAuto?boStep(UI["s_"+st.k]):null,S.settings.boAuto?boStep(UI["d_"+st.k]):null])}
 else if(st.t==="teach"){const it=BYID[st.id];if(!S.cards[st.id]){S.cards[st.id]={box:1,due:addDays(dkey(),1),seen:dkey(),r:0,w:0};S.newIdx=Math.max(S.newIdx,ITEMS.indexOf(it)+1);today().nw++;L.stats.nw++;save()}
  setTimeout(()=>playSeq([{en:it.en},{gap:350},boStep(it.bo),{gap:350},{en:it.en}]),250)}
 else if(st.t==="quiz"){const it=BYID[st.id];if(st.mode==="listen")setTimeout(()=>playSeq([promptOnce("listenWhich"),{en:it.en}]),300);else if(st.mode==="sound")setTimeout(()=>playSeq([promptOnce("howSay"),boStep(it.bo)]),300);else setTimeout(()=>playSeq([promptOnce("readWhich")]),300)}
 else if(st.t==="phrase")setTimeout(()=>playSeq([{en:st.p.en},{gap:350},boStep(st.p.bo),{gap:350},{en:st.p.en}]),300);
 else if(st.t==="pattern"){const pt=UNITS[st.ui].pattern;setTimeout(()=>playSeq([{en:pt.en},boStep(pt.note)]),300)}
 else if(st.t==="dialogue")setTimeout(()=>ACT.dlgAll(),400);
 else if(st.t==="letter"){if(L.kind==="daily"&&st.i>=S.letters){S.letters=st.i+1;today().lt++;save()}setTimeout(()=>playSeq([{en:letterSay(st.i)}]),300)}
 else if(st.t==="lquiz")setTimeout(()=>playSeq([promptOnce("whichLetter"),{en:LETTERS[st.i][1]}]),300);

}

 return `${subtop(UI.progress,"Progress")}

  <h3 style="margin-top:14px">${boTxt("རང་འགུལ་གྱིས་བོད་སྐད་སྒྲོག")}<span class="en-sub">Play Tibetan instructions automatically</span></h3>
  <div class="seg"><button class="${S.settings.boAuto?"on":""}" data-a="boAuto" data-v="1">On</button><button class="${S.settings.boAuto?"":"on"}" data-a="boAuto" data-v="0">Off</button></div></div>
 <div class="panel"><h3>${boTxt("སྐད་ཀྱི་མྱུར་ཚད།")}<span class="en-sub">English speaking speed</span></h3><div class="seg"><button class="${r<0.75?"on":""}" data-a="rate" data-v="0.65">${boTxt("དལ་མོ།")} · Slow</button><button class="${r>=0.75?"on":""}" data-a="rate" data-v="0.85">${boTxt("རྒྱུན་ལྡན།")} · Normal</button></div></div>
 <div class="panel"><h3>${boTxt("སྒྲ་གདངས་རོགས་རམ།")}<span class="en-sub">Pronunciation in Tibetan letters (first 30 days)</span></h3><div class="seg"><button class="${S.settings.hints?"on":""}" data-a="hints" data-v="1">On</button><button class="${S.settings.hints?"":"on"}" data-a="hints" data-v="0">Off</button></div></div>
 <div class="panel"><h3>${boTxt("ཨིན་ཇིའི་སྒྲ།")}<span class="en-sub">English voice</span></h3><select id="voiceSel" aria-label="English voice">${vopts}</select><div class="row" style="margin-top:10px"><button class="btn ghost" data-a="play" data-t="Hello. Thank you. Good morning.">Test the voice</button></div>
  ${!HAS_TTS||!voices.length?'<p class="en-sub" style="margin-top:8px">If there is no sound: on Android install "Speech Services by Google" and add English; on iPhone, Settings → Accessibility → Spoken Content → Voices → English.</p>':""}</div>
 <div class="panel"><h3>${boTxt("སློབ་མ།")}<span class="en-sub">Learner: ${prof.en}</span></h3><div class="row"><button class="btn ghost" data-a="switch">Switch learner</button></div>
  ${resetAsk?`<p style="margin:12px 0 8px"><span class="en-sub">Erase all of ${prof.en.split(" ")[0]}'s progress? This cannot be undone.</span></p><div class="row"><button class="btn danger" data-a="resetYes">Erase progress</button><button class="btn ghost" data-a="resetNo">Keep it</button></div>`
  :`<div class="row" style="margin-top:10px"><button class="btn ghost" data-a="resetAsk">Start over from zero</button></div>`}</div>
 <div class="panel howto"><h3><span style="font-weight:700">How this course works (for family helping out)</span></h3>
  <ul>
   <li><b>About 540 of the most-used English words in 90 days</b>, in three stages: survival basics, building sentences, real conversations.</li>
   <li><b>Ears before eyes.</b> Every word is heard first and matched to a picture. Reading English words alone only comes once a word is known by ear.</li>
   <li><b>Tibetan voice.</b> Once a family member records the Tibetan, every meaning and instruction can be heard. The Tibetan text lights up syllable by syllable while it plays, which also trains Tibetan reading.</li>
   <li><b>Six new words a day</b>, cut to three if reviews pile up. Stage 2 adds one sentence pattern per topic, explained in Tibetan. Stage 3 adds a short conversation per topic.</li>
   <li><b>Spaced review.</b> A word answered right returns after 1, 2, 4, 7, 14, 30 and 60 days. A missed word returns tomorrow and again a few minutes later.</li>
   <li><b>No punishment.</b> Mistakes just show the right answer with sound.</li>
   <li><b>30 minutes.</b> The ring fills with active minutes only. The daily lesson takes 15–25; extra practice fills the rest.</li>
  </ul>
  <p class="en-sub">Progress and recordings are saved on this phone only.</p></div>`;
}

/* ---------- recording studio ---------- */
let STU={i:null,recording:false,rec:null,stream:null,msg:"",filter:"todo"};
let _rl=null;
function recordList(){if(_rl)return _rl;const out=[],seen=new Set();const add=(t,ctx)=>{if(t&&!seen.has(t)){seen.add(t);out.push({t,ctx})}};
 Object.entries(UI).forEach(([k,v])=>add(v,"App instruction"));PROFILES.forEach(p=>add(p.bo,"Learner name"));
 UNITS.forEach((u,ui)=>{const tag=`Topic ${ui+1} · ${u.en}`;if(u.pattern){add(u.pattern.bo,`${tag} · pattern: ${u.pattern.en}`);add(u.pattern.note,`${tag} · grammar explanation`);u.pattern.ex.forEach(e=>add(e[1],`${tag} · example: ${e[0]}`))}
  u.items.forEach(a=>add(a[2],`${tag} · word: ${a[1]}`));u.phrases.forEach(p=>add(p[1],`${tag} · sentence: ${p[0]}`));(u.dialogue||[]).forEach(l=>add(l[2],`${tag} · conversation: ${l[1]}`))});
 return _rl=out}
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const canRecord=()=>!inFrame&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function stuIndex(){const L2=recordList();if(STU.i==null){const f=L2.findIndex(x=>!hasV(x.t));STU.i=f<0?0:f}return STU.i}
function viewStudio(){
 const list=recordList(),i=stuIndex(),x=list[i],done=list.filter(z=>hasV(z.t)).length,has=hasV(x.t);
 return `${subtop("བོད་སྐད་ཀྱི་སྒྲ་འཇུག","Record the Tibetan voice")}
 <div class="panel"><p style="font-size:.95rem">Read each Tibetan line aloud once, in a calm, clear voice. The app plays your recording wherever that Tibetan appears. Start with the first ones: they cover the instructions and the first weeks.</p>
  <div class="bar" style="margin-top:12px"><span style="width:${done/list.length*100}%"></span></div><p class="en-sub" style="margin-top:6px">${done} of ${list.length} recorded · item ${i+1}</p></div>
 <div class="studio-card"><span class="ctx">${esc(x.ctx)} ${has?'<span class="chip ok">recorded</span>':'<span class="chip no">not yet</span>'}</span>
  <div class="rtext">${bo(x.t,"",false)}</div>
  ${canRecord()?`<button class="recbtn ${STU.recording?"on":""}" data-a="${STU.recording?"recStop":"recStart"}" aria-label="${STU.recording?"Stop recording":"Start recording"}"><span><i></i></span></button><p class="en-sub">${STU.recording?"Recording… tap to stop":"Tap the red button, read the line, tap again"}</p>`
   :`<p class="notice" style="margin:0">Recording only works when this app is opened as a downloaded file in Chrome or Safari, not inside claude.ai. You can still import recordings below.</p>`}
  ${STU.msg?`<p class="en-sub">${esc(STU.msg)}</p>`:""}
  <div class="row">${has?`<button class="btn ghost" data-a="pbo" data-k="${kid(x.t)}">▶ Play</button>`:""}</div>
  <div class="row"><button class="btn ghost" data-a="stuPrev" ${i===0?"disabled":""}>← Back</button><button class="btn ghost" data-a="stuNext" ${i>=list.length-1?"disabled":""}>Next →</button></div>
  <div class="row"><button class="btn primary" data-a="stuMissing">Next not recorded</button></div></div>
 <div class="panel" style="margin-top:14px"><h3><span style="font-weight:700">Share recordings with another phone</span></h3>
  <p class="en-sub">Save all recordings as one file, send it (for example by WeChat), then import it on the parents' phone. Or send the file to Rafael and it can be built into the app.</p>
  <div class="row" style="margin-top:10px">${inFrame?"":`<button class="btn ghost" data-a="exportPack" ${done?"":"disabled"}>Save recordings file</button>`}<label class="btn ghost" for="packFile" style="cursor:pointer">Import recordings file</label></div>
  <input type="file" id="packFile" accept=".json,application/json" hidden></div>`;
}
async function recStart(){STU.msg="";try{if(!STU.stream)STU.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
 const mt=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
 const r=new MediaRecorder(STU.stream,mt?{mimeType:mt,audioBitsPerSecond:32000}:undefined);const chunks=[];const t=recordList()[stuIndex()].t;
 r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 r.onstop=async()=>{STU.recording=false;const blob=new Blob(chunks,{type:r.mimeType||mt||"audio/webm"});if(blob.size<800){STU.msg="That was too short. Try again.";render();return}setClip(t,blob);await idbPut(t,blob);render();playSeq([{bo:t}])};
 stopAll();r.start();STU.rec=r;STU.recording=true;render()}catch(e){STU.recording=false;STU.msg="The microphone is blocked. Allow microphone access for this page in the browser, then try again.";render()}}
function recStop(){if(STU.rec&&STU.rec.state!=="inactive")STU.rec.stop()}
async function exportPack(){const clips={};for(const[k,b] of BLOBS){const u=await blobToDataURL(b);if(u)clips[k]=u}
 const blob=new Blob([JSON.stringify({v:1,app:"tashi-delek-english",clips})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tibetan-voice.json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);STU.msg=`Saved ${Object.keys(clips).length} recordings. If nothing downloaded, open the app as a downloaded file instead.`;render()}
async function importPack(file){try{const pack=JSON.parse(await file.text());let n=0;for(const[k,v] of Object.entries(pack.clips||{})){const b=dataURLtoBlob(v);setClip(k,b);await idbPut(k,b);n++}STU.msg=`Imported ${n} recordings.`;STU.i=null}catch(e){STU.msg="That file could not be read. Choose the tibetan-voice.json file."}render()}

/* ---------- actions ---------- */
const ACT={
 profile:d=>{P=d.id;LS.set("tde.profile",P);S=loadProfile(P);go("home")},
 switch:()=>{P=null;S=null;LS.set("tde.profile",null);stopAll();render()},
 nav:d=>{if(d.s==="studio")STU.msg="";go(d.s)},
 startDaily:()=>startLesson("daily"),
 startPractice:()=>startLesson("practice"),
 quit:()=>{save();go("home")},
 play:d=>playSeq([{en:d.t,slow:!!d.slow}]),
 pbo:d=>playSeq([{bo:KEYS[Number(d.k)]}]),
 say:()=>{L.say=Math.min(3,L.say+1);render()},
 next:()=>{const st=cur();if(st.t==="phrase"&&L.kind==="daily"){today().ph++;if(st.isNew)S.phraseIdx++;save()}
  if(st.t==="dialogue"&&L.kind==="daily"){if(!S.dlg.includes(st.ui))S.dlg.push(st.ui);today().dl=true;save()}
  if(st.reading)today().rd=true;
  if(L.i<L.steps.length-1)L.i++;L.ans=null;L.sel=null;L.say=0;stopAll();render();window.scrollTo(0,0)},
 pick:d=>{const st=cur();if(L.ans)return;const ok=d.id===st.id;L.ans={pick:d.id,ok};grade(st,ok);render();playSeq([S.settings.boAuto?boStep(ok?UI.correct:UI.answerIs):null,{en:BYID[st.id].en}])},
 sel:d=>{if(L.ans)return;L.sel=d.id;render();playSeq([{en:BYID[d.id].en}])},
 check:()=>{const st=cur();if(!L.sel||L.ans)return;const ok=L.sel===st.id;L.ans={pick:L.sel,ok};grade(st,ok);render();playSeq([S.settings.boAuto?boStep(ok?UI.correct:UI.answerIs):null,{en:BYID[st.id].en}])},
 lpick:d=>{const st=cur();if(L.ans)return;const i=Number(d.i),ok=i===st.i;L.ans={pick:i,ok};ok?L.stats.r++:L.stats.w++;render();playSeq([{en:LETTERS[st.i][1]}])},
 phraseBuild:()=>{cur().phase="build";L.say=0;stopAll();render();playSeq([promptOnce("order")])},
 chip:d=>{const st=cur();const wi=st.pool.splice(Number(d.k),1)[0];st.ans.push(wi);render();playSeq([{en:st.words[wi].replace(/[.,!?]/g,"")}])},
 unchip:d=>{const st=cur();const wi=st.ans.splice(Number(d.k),1)[0];st.pool.push(wi);render()},
 phraseCheck:()=>{const st=cur();st.ok=st.ans.map(i=>st.words[i]).join(" ")===st.p.en;st.phase="result";st.ok?L.stats.r++:L.stats.w++;render();playSeq([S.settings.boAuto?boStep(st.ok?UI.correct:UI.answerIs):null,{en:st.p.en}])},
 dlgAll:()=>{const st=cur();if(!st||st.t!=="dialogue")return;const dl=UNITS[st.ui].dialogue;stopAll();const my=seqTok;(async()=>{for(let i=0;i<dl.length;i++){if(my!==seqTok)return;document.querySelectorAll(".dline").forEach(e=>e.classList.toggle("now",e.id==="dl"+i));await speakP(dl[i][1]);if(my!==seqTok)return;if(hasV(dl[i][2])){await sleep(250);await playBoRaw(dl[i][2])}await sleep(500)}document.querySelectorAll(".dline.now").forEach(e=>e.classList.remove("now"))})()},
 dlgQuiz:()=>{cur().phase="quiz";stopAll();render();playSeq([promptOnce("dlgQ"),{en:cur().q[1]}])},
 dlgPick:d=>{const st=cur();if(st.ans)return;const dl=UNITS[st.ui].dialogue,i=Number(d.i),ok=dl[i]===st.q;st.ans={pick:i,ok};ok?L.stats.r++:L.stats.w++;render();playSeq([S.settings.boAuto?boStep(ok?UI.correct:UI.answerIs):null,boStep(st.q[2])])},
 rate:d=>{S.settings.rate=Number(d.v);save();render();playSeq([{en:"Hello"}])},
 hints:d=>{S.settings.hints=d.v==="1";save();render()},
 boAuto:d=>{S.settings.boAuto=d.v==="1";save();render()},
 resetAsk:()=>{resetAsk=true;render()},
 resetNo:()=>{resetAsk=false;render()},
 resetYes:()=>{const st=S.settings;S=defaults();S.settings=st;save();resetAsk=false;go("home")},
 recStart:()=>recStart(), recStop:()=>recStop(),
 stuPrev:()=>{STU.i=Math.max(0,stuIndex()-1);STU.msg="";render()},
 stuNext:()=>{STU.i=Math.min(recordList().length-1,stuIndex()+1);STU.msg="";render()},
 stuMissing:()=>{const l=recordList(),s=stuIndex();let f=l.findIndex((x,j)=>j>s&&!hasV(x.t));if(f<0)f=l.findIndex(x=>!hasV(x.t));if(f>=0)STU.i=f;STU.msg=f<0?"Everything is recorded.":"";render()},
 exportPack:()=>exportPack()
};
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.stopPropagation();f(b.dataset,b)}});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}});
app.addEventListener("change",e=>{if(e.target.id==="voiceSel"){S.settings.voice=e.target.value;save();playSeq([{en:"Hello, how are you?"}])}if(e.target.id==="packFile"&&e.target.files[0])importPack(e.target.files[0])});
app.addEventListener("toggle",e=>{if(e.target.matches("details.unit")&&e.target.open){const all=[...document.querySelectorAll("details.unit")];openUnit=all.indexOf(e.target)}},true);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
render();initVoice();
</script>
